<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crocodile Facts</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wildlife-bg"></div>
    <div class="fact-container">
        <img src="croc.jpg" alt="Crocodile" class="croc-img">
        <h1 class="title">Wild Life: Crocodile Facts</h1>
        <p id="fact-display" class="fact-animate">Click the button to see a random crocodile fact!</p>
        <div class="fact-controls">
            <button id="fact-button">Show Random Fact</button>
            <button id="next-fact">Next Fact</button>
            <button id="toggle-all">Show All Facts</button>
        </div>
        <div id="fact-counter">Fact 0 of 10</div>
        <ul id="all-facts" class="hidden"></ul>
    </div>
    <script>
        const facts = [
            { "fact": "Crocodiles are large aquatic reptiles found in Africa, Asia, the Americas, and Australia." },
            { "fact": "They are members of the order Crocodylia, which also includes alligators, caimans, and gharials." },
            { "fact": "Crocodiles have a powerful bite, with some species having the strongest bite force of any animal." },
            { "fact": "They are carnivorous and primarily feed on fish, birds, mammals, and occasionally smaller crocodiles." },
            { "fact": "Crocodiles have a lifespan that can exceed 70 years in the wild." },
            { "fact": "They are excellent swimmers and can hold their breath underwater for up to an hour." },
            { "fact": "Crocodiles have a unique heart structure with four chambers, similar to birds and mammals." },
            { "fact": "They are known for their ability to regulate their body temperature through basking and seeking shade." },
            { "fact": "Crocodiles communicate through vocalizations, body postures, and chemical signals." },
            { "fact": "They have a protective bony plate called osteoderms or scutes on their back." }
        ];
        let currentFact = 0;
        const factDisplay = document.getElementById('fact-display');
        const factCounter = document.getElementById('fact-counter');
        const allFactsList = document.getElementById('all-facts');
        function showFact(index) {
            factDisplay.classList.remove('show');
            setTimeout(() => {
                factDisplay.textContent = facts[index].fact;
                factDisplay.classList.add('show');
                factCounter.textContent = `Fact ${index + 1} of ${facts.length}`;
            }, 200);
        }
        document.getElementById('fact-button').addEventListener('click', () => {
            const randomIndex = Math.floor(Math.random() * facts.length);
            currentFact = randomIndex;
            showFact(randomIndex);
        });
        document.getElementById('next-fact').addEventListener('click', () => {
            currentFact = (currentFact + 1) % facts.length;
            showFact(currentFact);
        });
        document.getElementById('toggle-all').addEventListener('click', () => {
            allFactsList.classList.toggle('hidden');
            if (!allFactsList.classList.contains('hidden')) {
                allFactsList.innerHTML = facts.map(f => `<li>🦎 ${f.fact}</li>`).join('');
            } else {
                allFactsList.innerHTML = '';
            }
        });
        // Initial state
        showFact(currentFact);
    </script>
</body>
</html>
